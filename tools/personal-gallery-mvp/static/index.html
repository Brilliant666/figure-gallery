<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Personal Figure Gallery</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell home-shell">
      <header class="hero">
        <p class="eyebrow">LOCAL · PRIVATE · OWNER-OPERATED</p>
        <h1>Personal Figure Gallery</h1>
        <p>输入角色名，生成仅保存在本机的动作参考图库。</p>
      </header>

      <aside class="source-notice" role="alert">
        <strong>来源模式：Official sources</strong>
        <p>
          Hpoi 实时来源已停用（Blocked by captcha），不会自动重试。本工具只在你主动启动后搜索允许的厂商官方域名，
          不使用 Cookie、登录、验证码绕过、代理轮换、增强代理或反检测能力。
        </p>
      </aside>

      <form id="collect-form" class="panel collection-form">
        <label>
          角色名称
          <input id="query" name="query" value="柴郡" required autocomplete="off" />
        </label>
        <div class="limit-grid">
          <label>
            每查询搜索结果
            <input name="maxSearchResults" type="number" value="10" min="1" max="10" />
          </label>
          <label>
            最大官方商品
            <input name="maxProducts" type="number" value="20" min="1" max="20" />
          </label>
          <label>
            每商品图片
            <input name="maxImagesPerProduct" type="number" value="10" min="1" max="10" />
          </label>
        </div>
        <label class="permission-confirmation">
          <input name="confirmOfficialSourceAccess" type="checkbox" required />
          我确认本次只访问公开厂商官方商品页，并主动启动有限、低频、只读的官方来源收集。
        </label>
        <div class="actions">
          <button id="start-button" type="submit">开始官方来源收集</button>
          <button id="stop-button" type="button" class="secondary" disabled>停止当前任务</button>
        </div>
      </form>

      <section class="panel" aria-labelledby="status-heading">
        <div class="section-heading">
          <h2 id="status-heading">运行状态</h2>
          <span id="status-pill" class="status-pill">idle</span>
        </div>
        <p id="status-message" class="muted">暂无运行。</p>
        <dl class="metrics">
          <div><dt>搜索/页面</dt><dd id="pages-count">0</dd></div>
          <div><dt>商品</dt><dd id="products-count">0</dd></div>
          <div><dt>图片</dt><dd id="images-count">0</dd></div>
          <div><dt>失败</dt><dd id="failures-count">0</dd></div>
        </dl>
        <a id="active-gallery-link" class="button-link hidden" href="#">打开图库</a>
      </section>

      <section class="panel" aria-labelledby="recent-heading">
        <h2 id="recent-heading">最近运行</h2>
        <div id="recent-runs" class="recent-list"><p class="muted">尚无本地记录。</p></div>
      </section>
    </main>
    <script type="module" src="/assets/home.js"></script>
  </body>
</html>
